# The surf-api Gradle plugin reads the project while the shadow jar is built, which the
# configuration cache does not support
org.gradle.configuration-cache=false
org.gradle.caching=true

systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Opt-in for internal plugins from private GitHub Packages (see docs/internal-plugins.md).
# Requires repo access: also set gpr.user/gpr.key (or GITHUB_ACTOR/GITHUB_TOKEN),
# ideally in ~/.gradle/gradle.properties.
#internalPlugins=true

projectVersion=2.0.0