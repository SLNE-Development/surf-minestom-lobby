[versions]
guice = "7.0.0"
configurate = "1.0.0"
flare = "2.0.1" # matches the version minestom ships with
fabric-mixin = "0.17.3+mixin.0.8.7"
mixin-extra = "0.5.4"
asm = "9.10.1"
polar = "1.16.0"
mini-placeholders = "3.2.0"
adventure = "5.2.0" # matches the version minestom ships with

komapper = "7.0.0"
hikari = "7.0.2"
mariadb-jdbc = "3.5.8"
postgresql-jdbc = "42.7.13"

[libraries]
guice = { module = "com.google.inject:guice", version.ref = "guice" }
flare-fastutil = { module = "space.vectrix.flare:flare-fastutil", version.ref = "flare" }
fabric-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "fabric-mixin" }
mixin-extra = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixin-extra" }
polar = { module = "dev.hollowcube:polar", version.ref = "polar" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
mini-placeholders-minestom ={ module = "io.github.miniplaceholders:miniplaceholders-minestom", version.ref = "mini-placeholders" }

configurate-yaml = { module = "dev.slne.forks.configurate:configurate-yaml", version.ref = "configurate" }
configurate-kotlin = { module = "dev.slne.forks.configurate:configurate-extra-kotlin", version.ref = "configurate" }

komapper-annotation = { module = "org.komapper:komapper-annotation", version.ref = "komapper" }
komapper-jdbc = { module = "org.komapper:komapper-jdbc", version.ref = "komapper" }
komapper-slf4j = { module = "org.komapper:komapper-slf4j", version.ref = "komapper" }
komapper-processor = { module = "org.komapper:komapper-processor", version.ref = "komapper" }

komapper-dialect-mariadb-jdbc = { module = "org.komapper:komapper-dialect-mariadb-jdbc", version.ref = "komapper" }
komapper-dialect-postgresql-jdbc = { module = "org.komapper:komapper-dialect-postgresql-jdbc", version.ref = "komapper" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql-jdbc" }
