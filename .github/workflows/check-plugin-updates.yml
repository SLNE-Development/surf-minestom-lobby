name: Check plugin updates

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: check-plugin-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production

    steps:
      - name: Mint a push token
        id: push-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LOCK_PUSH_APP_ID }}
          private-key: ${{ secrets.LOCK_PUSH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.push-token.outputs.token }}
          ref: master
          fetch-depth: 0

      - name: Probe bundled plugin versions
        shell: bash
        env:
          GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
          REPOSILITE_USER: ${{ secrets.REPOSILITE_PRIVATE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_PRIVATE_TOKEN }}
        run: bash .github/scripts/bundled-plugin-versions.sh > plugin-versions.new

      - name: Compare with the recorded versions
        id: compare
        shell: bash
        run: |
          lock=.github/bundled-plugins.lock

          if [ ! -f "$lock" ]; then
            state=bootstrap
          elif tr -d '\r' < "$lock" > plugin-versions.old &&
            diff -u plugin-versions.old plugin-versions.new > plugin-versions.diff; then
            state=unchanged
          else
            state=updated
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"

          {
            echo "## Bundled plugin update check"
            echo

            case "$state" in
              bootstrap)
                echo "No lock file yet - recording the current versions as the baseline."
                echo "No version bump or publish will be triggered."
                ;;
              unchanged)
                echo "No plugin updates."
                ;;
              updated)
                echo "Plugin updates found."
                echo
                echo '```diff'
                tail -n +3 plugin-versions.diff
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare dependency update
        id: prepare
        if: steps.compare.outputs.state == 'updated'
        shell: bash
        run: |
          cp plugin-versions.new .github/bundled-plugins.lock

          current_version="$(sed -n 's/^projectVersion=//p' gradle.properties | tr -d '\r')"

          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "error: invalid projectVersion '$current_version'" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          next_version="$major.$((minor + 1)).0"

          sed -i \
            "s/^projectVersion=.*/projectVersion=$next_version/" \
            gradle.properties

          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
          echo "next-version=$next_version" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "Version bump:"
            echo
            echo "\`$current_version\` → \`$next_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record initial dependency baseline
        if: steps.compare.outputs.state == 'bootstrap'
        shell: bash
        run: cp plugin-versions.new .github/bundled-plugins.lock

      - name: Commit changes
        if: steps.compare.outputs.state != 'unchanged'
        shell: bash
        env:
          STATE: ${{ steps.compare.outputs.state }}
          NEXT_VERSION: ${{ steps.prepare.outputs.next-version }}
        run: |
          git config user.name github-actions
          git config user.email actions@slne.dev

          git add .github/bundled-plugins.lock gradle.properties

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          if [ "$STATE" = "updated" ]; then
            git commit -m "⬆️ chore(deps): update bundled plugins and bump to $NEXT_VERSION"
          else
            git commit -m "⬆️ chore(deps): record bundled plugin versions"
          fi

          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master