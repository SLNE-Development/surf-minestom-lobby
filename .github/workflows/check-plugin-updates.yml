name: Check plugin updates

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: check-plugin-updates
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    steps:
      - name: Mint a push token
        id: push-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LOCK_PUSH_APP_ID }}
          private-key: ${{ secrets.LOCK_PUSH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.push-token.outputs.token }}

      - name: Probe bundled plugin versions
        shell: bash
        env:
          GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
          REPOSILITE_USER: ${{ secrets.REPOSILITE_PRIVATE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_PRIVATE_TOKEN }}
        run: bash .github/scripts/bundled-plugin-versions.sh > plugin-versions.new

      - name: Compare with the recorded versions
        id: compare
        shell: bash
        run: |
          lock=.github/bundled-plugins.lock

          if [ ! -f "$lock" ]; then
            state=bootstrap
          elif tr -d '\r' < "$lock" > plugin-versions.old &&
            diff -u plugin-versions.old plugin-versions.new > plugin-versions.diff; then
            state=unchanged
          else
            state=updated
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"

          {
            echo "## Bundled plugin update check"
            echo
            case $state in
            bootstrap)
              echo "No lock file yet - recorded the current versions as the baseline."
              echo "No publish triggered."
              ;;
            unchanged)
              echo "No plugin updates."
              ;;
            updated)
              echo "Updates found, triggering \`publish-server.yml\`:"
              echo
              echo '```diff'
              tail -n +3 plugin-versions.diff
              echo '```'
              ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger the publish workflow
        if: steps.compare.outputs.state == 'updated'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -sS -o dispatch.out -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/publish-server.yml/dispatches" \
            -d '{"ref":"master"}')

          if [ "$status" != 204 ]; then
            echo "error: dispatching publish-server.yml failed with HTTP $status" >&2
            cat dispatch.out >&2
            exit 1
          fi

      - name: Record the current versions
        if: steps.compare.outputs.state != 'unchanged' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          cp plugin-versions.new .github/bundled-plugins.lock
          git config user.name github-actions
          git config user.email actions@slne.dev
          git add .github/bundled-plugins.lock

          if git diff --cached --quiet -- .github/bundled-plugins.lock; then
            echo "lock file already up to date"
            exit 0
          fi

          git commit -m '⬆️ chore(deps): record bundled plugin versions'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
